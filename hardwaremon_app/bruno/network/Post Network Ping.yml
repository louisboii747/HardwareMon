info:
  name: Post Network Ping
  type: http
  seq: 2
  tags:
    - network

http:
  method: POST
  url: "{{baseUrl}}/network/ping"
  body:
    type: json
    data: |-
      {
        "target": "",
        "count": 0,
        "timeout": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/network/ping"
      method: POST
      body:
        type: json
        data: |-
          {
            "target": "",
            "count": 0,
            "timeout": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/network/ping"
      method: POST
      body:
        type: json
        data: |-
          {
            "target": "",
            "count": 0,
            "timeout": 0
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }
